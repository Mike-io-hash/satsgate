name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt -r proxy/requirements.txt -r mcp/requirements.txt -r gate/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Express receipt vectors
        run: node proxy/snippets/express_receipt.test.js

      - name: Webhook signature vector
        run: node tests/webhook_signature.test.js

      - name: Ruff
        run: ruff check app tests proxy/src proxy/snippets/fastapi_verify.py proxy/snippets/fastapi_receipt.py mcp/src mcp/scripts gate/src sdk/python/src cli/src scripts/release

      - name: Bandit
        run: bandit -r app proxy/src mcp/src gate/src sdk/python/src cli/src scripts/release -ll

      - name: pip-audit
        run: pip-audit -r requirements.txt -r proxy/requirements.txt -r mcp/requirements.txt -r gate/requirements.txt

      - name: Workflow lint
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements-lint.txt
          actionlint
          zizmor --offline --min-severity medium .github/workflows

      - name: Run tests
        run: pytest -q

  init-py310:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install from the tree and run init tests
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt -r proxy/requirements.txt
          pip install -e sdk/python -e proxy -e cli
          pytest -q tests/test_init_*.py

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/connect/package-lock.json

      - name: Install, test, and build
        working-directory: web/connect
        run: npm ci && npm test && npm run build

      - name: npm audit (informational)
        working-directory: web/connect
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  proxy-mcp-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt -r proxy/requirements.txt "mcp>=1.30,<2" "x402[evm,mcp]==2.28.0"

      - name: Run tests
        env:
          SATSGATE_MCP_V1_JOB: "1"
        run: pytest -q tests/test_proxy_mcp_origin_v1.py tests/test_proxy_mcp_x402_client_v1.py
