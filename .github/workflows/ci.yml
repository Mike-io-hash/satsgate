name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt -r proxy/requirements.txt -r mcp/requirements.txt -r gate/requirements.txt

      - name: Ruff
        run: ruff check app tests proxy/src proxy/snippets/fastapi_verify.py mcp/src mcp/scripts gate/src

      - name: Bandit
        run: bandit -r app proxy/src mcp/src gate/src -ll

      - name: pip-audit
        run: pip-audit -r requirements.txt -r proxy/requirements.txt -r mcp/requirements.txt -r gate/requirements.txt

      - name: Run tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/connect/package-lock.json

      - name: Install, test, and build
        working-directory: web/connect
        run: npm ci && npm test && npm run build

      - name: npm audit (informational)
        working-directory: web/connect
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
