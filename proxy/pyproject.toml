[project]
name = "satsgate-proxy"
version = "0.14.2"
description = "Charge AI agents in Lightning and USDC on the same 402. Payments go straight to your wallet. 500 free unlocks a month."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "pymacaroons>=0.13.0",
]

[project.scripts]
satsgate-proxy = "satsgate_proxy.__main__:main"

[project.urls]
Homepage = "https://github.com/Mike-io-hash/satsgate"
Issues = "https://github.com/Mike-io-hash/satsgate/issues"
Changelog = "https://github.com/Mike-io-hash/satsgate/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
