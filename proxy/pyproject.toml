[project]
name = "satsgate-proxy"
version = "0.12.0"
description = "Self-hosted L402 reverse proxy for an existing HTTP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "pymacaroons>=0.13.0",
]

[project.scripts]
satsgate-proxy = "satsgate_proxy.__main__:main"

[project.urls]
Homepage = "https://github.com/Mike-io-hash/satsgate"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
