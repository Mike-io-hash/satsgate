# Origin check with njs. Install the njs module, then:
#   js_import satsgate from /etc/satsgate/nginx_verify.js;
#   js_set is not required. The content handler below is the gate.
# Set $satsgate_origin_secret from the environment, not from a request header.
# request_uri is the raw path and query, which is what the proxy signs.

js_import satsgate from /etc/satsgate/nginx_verify.js;

server {
    listen 8080;
    server_name api.internal;

    location / {
        js_content satsgate.nginxVerify;
    }

    location @origin {
        internal;
        proxy_pass http://127.0.0.1:8081;
    }
}
