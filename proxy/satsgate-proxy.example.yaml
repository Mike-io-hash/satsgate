# Copy to satsgate-proxy.yaml. Secrets stay in the environment.
# SATSGATE_API_KEY=sgr_...   SATSGATE_ORIGIN_SECRET=$(openssl rand -hex 32)

core:
  base_url: https://api.satsgate.org
  api_key_env: SATSGATE_API_KEY
  timeout_seconds: 20

upstream:
  base_url: http://api:8080
  timeout_seconds: 30
  # Uncomment to inject a credential the buyer never sees. The value is the
  # environment variable, and it is not written to the log.
  # inject_headers:
  #   - name: Authorization
  #     value_env: UPSTREAM_AUTHORIZATION

origin:
  secret_env: SATSGATE_ORIGIN_SECRET
  max_skew_seconds: 300

pricing:
  # Trial is about 5 sats per credit. per_request below 10x this logs a warning.
  sats_per_credit: 5

server:
  host: 0.0.0.0
  port: 8080
  # Addresses allowed to send X-Forwarded-For to this proxy. Empty uses the TCP peer.
  trusted_proxies: []
  pending_retry_after_seconds: 2

limits:
  max_request_bytes: 1048576
  max_response_bytes: 10485760

free_paths:
  - /health
  - /public/**

routes:
  # 100 sats is above 10 x 5, so this per-request price does not warn.
  - name: article
    methods: [GET]
    path: /blog/**
    price_sats: 100
    access: per_request
    scope: route
    description: One article read
  # A cheap call is a bundle. One credit, twenty requests.
  - name: search
    methods: [GET]
    path: /search
    price_sats: 21
    access: uses:20
    scope: route
    description: Twenty searches
  - name: hour
    methods: [GET, POST]
    path_regex: "^/v1/.*$"
    price_sats: 50
    access: pass:3600
    scope: route
    description: One hour of API access
