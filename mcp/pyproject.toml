[project]
name = "satsgate-mcp"
version = "0.9.1"
description = "Buyer-side MCP server for Satsgate L402 resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27.0",
  "pymacaroons>=0.13.0",
  "segno>=1.6.0",
  "nostr-sdk>=0.45.0,<0.46",
]

[project.scripts]
satsgate-mcp = "satsgate_mcp.__main__:main"
satsgate-mcp-pay = "satsgate_mcp.manual:main"

[project.urls]
Homepage = "https://github.com/Mike-io-hash/satsgate"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
