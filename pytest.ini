[pytest]
# Pytest 9 imports tests with importlib and does not put the repo root on
# sys.path. CI runs the pytest script, so `import app`, `import satsgate_proxy`,
# and `import satsgate_mcp` need this. `python -m pytest` hides the gap because
# it adds the cwd itself.
pythonpath = . proxy/src mcp/src gate/src
