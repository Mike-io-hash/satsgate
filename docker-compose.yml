services:
  satsgate:
    build: .
    restart: unless-stopped
    environment:
      # Core. production refuses a weak secret, dev mode, and the mock wallet.
      SATSGATE_ENV: ${SATSGATE_ENV:-production}
      SATSGATE_MACAROON_SECRET: ${SATSGATE_MACAROON_SECRET}
      SATSGATE_MACAROON_KEY_ID: ${SATSGATE_MACAROON_KEY_ID:-1}
      SATSGATE_MACAROON_PREVIOUS_KEYS: ${SATSGATE_MACAROON_PREVIOUS_KEYS:-}
      SATSGATE_LN_NETWORK: ${SATSGATE_LN_NETWORK:-mainnet}
      # Caddy is 172.28.0.2. The gate container is 172.28.0.4.
      # Both are trusted for X-Satsgate-Buyer-Ip. Caddy strips that header on
      # public requests, so a buyer cannot spoof it. The gate sets it itself.
      # Uvicorn still trusts X-Forwarded-For only from Caddy (the next line).
      SATSGATE_TRUSTED_PROXIES: ${SATSGATE_TRUSTED_PROXIES:-172.28.0.2,172.28.0.4}
      SATSGATE_FORWARDED_ALLOW_IPS: ${SATSGATE_FORWARDED_ALLOW_IPS:-172.28.0.2}

      # Wallet (for topups)
      SATSGATE_WALLET_MODE: ${SATSGATE_WALLET_MODE:-lnaddr}
      SATSGATE_LIGHTNING_ADDRESS: ${SATSGATE_LIGHTNING_ADDRESS}

      # DB
      SATSGATE_DB_PATH: /data/satsgate.sqlite3

      # Demo endpoint pricing (optional)
      SATSGATE_PRICE_SATS: ${SATSGATE_PRICE_SATS:-10}
      SATSGATE_TOKEN_TTL_SECONDS: ${SATSGATE_TOKEN_TTL_SECONDS:-600}

      # Rate limiting
      SATSGATE_RL_ENABLED: ${SATSGATE_RL_ENABLED:-1}
      SATSGATE_RL_WINDOW_SECONDS: ${SATSGATE_RL_WINDOW_SECONDS:-60}
      SATSGATE_RL_MAX_ANON: ${SATSGATE_RL_MAX_ANON:-60}
      SATSGATE_RL_MAX_AUTH: ${SATSGATE_RL_MAX_AUTH:-600}
      SATSGATE_RL_MAX_CHALLENGE: ${SATSGATE_RL_MAX_CHALLENGE:-30}
      SATSGATE_RL_MAX_TOPUP: ${SATSGATE_RL_MAX_TOPUP:-10}
      SATSGATE_RL_MAX_KEYS: ${SATSGATE_RL_MAX_KEYS:-10000}

      # Operator/admin token (optional). Approves sites. Not the gate token.
      SATSGATE_ADMIN_TOKEN: ${SATSGATE_ADMIN_TOKEN:-}

      # Sites registry. Unset keeps current clients working. The secret key is
      # required before the first site is created (openssl rand -hex 32).
      SATSGATE_SITE_SECRET_KEY: ${SATSGATE_SITE_SECRET_KEY:-}
      SATSGATE_SITES_AUTO_APPROVE: ${SATSGATE_SITES_AUTO_APPROVE:-0}
      SATSGATE_SITES_MAX_PER_ACCOUNT: ${SATSGATE_SITES_MAX_PER_ACCOUNT:-3}
      SATSGATE_SITES_MAX_ROUTES: ${SATSGATE_SITES_MAX_ROUTES:-20}
      SATSGATE_GATE_PUBLIC_BASE: ${SATSGATE_GATE_PUBLIC_BASE:-https://gate.satsgate.org}
      # Shared with the gate service. Unset hides /internal/gate/*.
      SATSGATE_GATE_TOKEN: ${SATSGATE_GATE_TOKEN:-}
      # Only the gate container may present that token. Empty would allow any peer.
      SATSGATE_GATE_PEERS: ${SATSGATE_GATE_PEERS:-172.28.0.4}

      # x402. SATSGATE_X402_NETWORK must stay eip155:84532 (the public facilitator).
      # Base mainnet is SATSGATE_X402_CDP, not that variable. Leave the switch at 0.
      # These three CDP variables stay on this service. The gate must not receive them.
      SATSGATE_X402_FACILITATOR_URL: ${SATSGATE_X402_FACILITATOR_URL:-https://x402.org/facilitator}
      SATSGATE_X402_NETWORK: ${SATSGATE_X402_NETWORK:-eip155:84532}
      SATSGATE_X402_OFFER_SECONDS: ${SATSGATE_X402_OFFER_SECONDS:-60}
      SATSGATE_X402_PAYEE_CHALLENGE_SECONDS: ${SATSGATE_X402_PAYEE_CHALLENGE_SECONDS:-1800}
      SATSGATE_PAYEE_CONNECT_SECONDS: ${SATSGATE_PAYEE_CONNECT_SECONDS:-3600}
      SATSGATE_CONNECT_PUBLIC_BASE: ${SATSGATE_CONNECT_PUBLIC_BASE:-https://satsgate.org/connect}
      SATSGATE_X402_CDP: ${SATSGATE_X402_CDP:-0}
      SATSGATE_X402_CDP_KEY_ID: ${SATSGATE_X402_CDP_KEY_ID:-}
      SATSGATE_X402_CDP_KEY_SECRET: ${SATSGATE_X402_CDP_KEY_SECRET:-}
      # Credit packs only. Empty disables GET /v1/topup/{plan_id}/x402.
      # While CDP is on, packs are Base mainnet USDC. While it is off, Base Sepolia.
      SATSGATE_TREASURY_EVM_ADDRESS: ${SATSGATE_TREASURY_EVM_ADDRESS:-}

      # BTC/USD quote. Not a conversion. Defaults match the code.
      SATSGATE_RATES_ENABLED: ${SATSGATE_RATES_ENABLED:-1}
      SATSGATE_RATES_REFRESH_SECONDS: ${SATSGATE_RATES_REFRESH_SECONDS:-60}
      SATSGATE_RATES_STALE_SECONDS: ${SATSGATE_RATES_STALE_SECONDS:-180}
      SATSGATE_RATES_SOURCE_TIMEOUT_SECONDS: ${SATSGATE_RATES_SOURCE_TIMEOUT_SECONDS:-2}
      SATSGATE_RATES_OUTLIER_BPS: ${SATSGATE_RATES_OUTLIER_BPS:-200}

      # Disable dev endpoints in production
      SATSGATE_DEV_MODE: ${SATSGATE_DEV_MODE:-0}
    volumes:
      - satsgate_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      internal:
        # Caddy owns 172.28.0.2. Without a pin the app can claim it first.
        ipv4_address: 172.28.0.3

  gate:
    build:
      context: ./gate
    restart: unless-stopped
    depends_on:
      satsgate:
        condition: service_healthy
    environment:
      SATSGATE_GATE_CORE_URL: http://satsgate:8000
      SATSGATE_GATE_TOKEN: ${SATSGATE_GATE_TOKEN:-}
      # Caddy is the only public peer. It strips X-Satsgate-Buyer-Ip.
      SATSGATE_GATE_TRUSTED_PROXIES: ${SATSGATE_GATE_TRUSTED_PROXIES:-172.28.0.2}
      SATSGATE_GATE_CACHE_SECONDS: ${SATSGATE_GATE_CACHE_SECONDS:-5}
      SATSGATE_GATE_CORE_TIMEOUT: ${SATSGATE_GATE_CORE_TIMEOUT:-10}
      SATSGATE_GATE_UPSTREAM_TIMEOUT: ${SATSGATE_GATE_UPSTREAM_TIMEOUT:-15}
      SATSGATE_GATE_MAX_REQUEST_BYTES: ${SATSGATE_GATE_MAX_REQUEST_BYTES:-1048576}
      SATSGATE_GATE_MAX_RESPONSE_BYTES: ${SATSGATE_GATE_MAX_RESPONSE_BYTES:-10485760}
      SATSGATE_GATE_RL_WINDOW_SECONDS: ${SATSGATE_GATE_RL_WINDOW_SECONDS:-60}
      SATSGATE_GATE_RL_PER_SITE: ${SATSGATE_GATE_RL_PER_SITE:-600}
      SATSGATE_GATE_RL_PER_BUYER: ${SATSGATE_GATE_RL_PER_BUYER:-60}
      SATSGATE_GATE_PENDING_RETRY_AFTER: ${SATSGATE_GATE_PENDING_RETRY_AFTER:-2}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      internal:
        ipv4_address: 172.28.0.4

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - satsgate
    ports:
      - "80:80"
      - "443:443"
    environment:
      SATSGATE_HOSTNAME: ${SATSGATE_HOSTNAME}
      # Required. An empty value makes Caddy refuse the whole file, including the API site.
      SATSGATE_SITE_HOSTNAME: ${SATSGATE_SITE_HOSTNAME}
      # Reown AppKit project ID. Not a secret. Caddy writes it into /connect/config.json.
      SATSGATE_REOWN_PROJECT_ID: ${SATSGATE_REOWN_PROJECT_ID:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/connect/dist:/srv/connect:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.28.0.2

volumes:
  satsgate_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
