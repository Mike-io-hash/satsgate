services:
  satsgate:
    build: .
    restart: unless-stopped
    environment:
      # Core. production refuses a weak secret, dev mode, and the mock wallet.
      SATSGATE_ENV: ${SATSGATE_ENV:-production}
      SATSGATE_MACAROON_SECRET: ${SATSGATE_MACAROON_SECRET}
      SATSGATE_MACAROON_KEY_ID: ${SATSGATE_MACAROON_KEY_ID:-1}
      SATSGATE_MACAROON_PREVIOUS_KEYS: ${SATSGATE_MACAROON_PREVIOUS_KEYS:-}
      SATSGATE_LN_NETWORK: ${SATSGATE_LN_NETWORK:-mainnet}
      # Caddy is pinned to 172.28.0.2 on the internal network.
      SATSGATE_TRUSTED_PROXIES: ${SATSGATE_TRUSTED_PROXIES:-172.28.0.2}
      SATSGATE_FORWARDED_ALLOW_IPS: ${SATSGATE_FORWARDED_ALLOW_IPS:-172.28.0.2}

      # Wallet (for topups)
      SATSGATE_WALLET_MODE: ${SATSGATE_WALLET_MODE:-lnaddr}
      SATSGATE_LIGHTNING_ADDRESS: ${SATSGATE_LIGHTNING_ADDRESS}

      # DB
      SATSGATE_DB_PATH: /data/satsgate.sqlite3

      # Demo endpoint pricing (optional)
      SATSGATE_PRICE_SATS: ${SATSGATE_PRICE_SATS:-10}
      SATSGATE_TOKEN_TTL_SECONDS: ${SATSGATE_TOKEN_TTL_SECONDS:-600}

      # Rate limiting
      SATSGATE_RL_ENABLED: ${SATSGATE_RL_ENABLED:-1}
      SATSGATE_RL_WINDOW_SECONDS: ${SATSGATE_RL_WINDOW_SECONDS:-60}
      SATSGATE_RL_MAX_ANON: ${SATSGATE_RL_MAX_ANON:-60}
      SATSGATE_RL_MAX_AUTH: ${SATSGATE_RL_MAX_AUTH:-600}
      SATSGATE_RL_MAX_CHALLENGE: ${SATSGATE_RL_MAX_CHALLENGE:-30}
      SATSGATE_RL_MAX_TOPUP: ${SATSGATE_RL_MAX_TOPUP:-10}
      SATSGATE_RL_MAX_KEYS: ${SATSGATE_RL_MAX_KEYS:-10000}

      # Operator/admin token (optional)
      SATSGATE_ADMIN_TOKEN: ${SATSGATE_ADMIN_TOKEN:-}

      # Disable dev endpoints in production
      SATSGATE_DEV_MODE: ${SATSGATE_DEV_MODE:-0}
    volumes:
      - satsgate_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      internal:
        # Caddy owns 172.28.0.2. Without a pin the app can claim it first.
        ipv4_address: 172.28.0.3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - satsgate
    ports:
      - "80:80"
      - "443:443"
    environment:
      SATSGATE_HOSTNAME: ${SATSGATE_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.28.0.2

volumes:
  satsgate_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
